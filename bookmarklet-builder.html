<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>SPO Explorer — ブックマークレット生成</title>
<style>
  body { font: 14px/1.7 -apple-system, "Segoe UI", "Yu Gothic UI", sans-serif;
         max-width: 820px; margin: 40px auto; padding: 0 20px; color: #222; }
  h1 { font-size: 20px; }
  h2 { font-size: 15px; margin-top: 28px; border-bottom: 1px solid #ddd; padding-bottom: 4px; }
  textarea { width: 100%; height: 160px; font-family: ui-monospace, Menlo, monospace;
             font-size: 11px; border: 1px solid #ccc; border-radius: 4px; padding: 8px; }
  button { padding: 8px 16px; font-size: 14px; cursor: pointer; }
  #link { display: inline-block; margin-top: 12px; padding: 8px 16px; background: #2f4f8f;
          color: #fff; text-decoration: none; border-radius: 4px; font-weight: bold; }
  #link.off { background: #bbb; pointer-events: none; }
  .note { background: #f6f6f6; border-left: 3px solid #999; padding: 10px 14px; font-size: 13px; }
  code { background: #f0f0f0; padding: 1px 4px; border-radius: 3px; }
</style>
</head>
<body>

<h1>SPO Explorer — ブックマークレット生成</h1>

<p class="note">
  <code>spo-explorer.js</code> を読み込んで、ブックマークバーにドラッグできるリンクを作ります。
  このページはローカルで開くだけで動きます（サーバー不要）。
</p>

<h2>1. ソースを読み込む</h2>
<p>
  <input type="file" id="file" accept=".js">
  … または下の欄に直接貼り付け
</p>
<textarea id="src" placeholder="spo-explorer.js の中身"></textarea>
<p><button id="build">ブックマークレットを生成</button></p>

<h2>2. ブックマークバーにドラッグ</h2>
<p><a id="link" class="off" href="#">SPO Explorer</a></p>
<p id="size" style="font-size:12px;color:#666"></p>

<h2>3. 生成された URL（手動で登録する場合）</h2>
<textarea id="out" readonly placeholder="ここに javascript: から始まる文字列が出ます"></textarea>

<script>
  const $ = (id) => document.getElementById(id);

  $('file').addEventListener('change', (e) => {
    const f = e.target.files[0];
    if (!f) return;
    const r = new FileReader();
    r.onload = () => { $('src').value = r.result; build(); };
    r.readAsText(f, 'utf-8');
  });

  $('build').addEventListener('click', build);

  function build() {
    const src = $('src').value.trim();
    if (!src) { alert('ソースが空です'); return; }

    // 圧縮はしない。javascript: URL は改行やコメントを含んだままで問題なく動く。
    // 変換は「全体を percent-encode するだけ」で済ませるのが一番壊れにくい。
    const url = 'javascript:' + encodeURIComponent(src + '\nvoid 0;');

    $('out').value = url;
    const a = $('link');
    a.href = url;
    a.classList.remove('off');
    $('size').textContent = `${url.length.toLocaleString()} 文字（Chrome / Edge は数万文字まで登録できます）`;
  }
</script>

</body>
</html>
